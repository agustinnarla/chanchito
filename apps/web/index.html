<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chanchito</title>
    <link rel="icon" type="image/webp" href="/brand/chanchito.webp" />
    <script>
      // Applies the theme before the first paint, like src/theme/theme.ts (no flash).
      try {
        var stored = localStorage.getItem('chanchito:theme')
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
