<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chanchito</title>
    <link rel="icon" type="image/webp" href="/brand/chanchito.webp" />
    <script>
      // Applies the theme and the accent color before the first paint, like src/theme (no flash).
      // The theme is per device ("system" or nothing follows the system); the accent is the last
      // one this browser saw, until the account's arrives.
      try {
        var theme = localStorage.getItem('chanchito:theme')
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        var accent = localStorage.getItem('chanchito:accent')
        if (/^(azul|violeta|rosa|naranja|turquesa)$/.test(accent || '')) {
          document.documentElement.dataset.accent = accent
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
